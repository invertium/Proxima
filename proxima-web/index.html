<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2213%22 font-size=%2213%22%3E🛸%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proxima — Bridge</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #05070f; color: #dbe7ff; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
      #view { display: block; width: 100vw; height: 100vh; }

      #hud { position: fixed; top: 16px; left: 16px; width: 340px; padding: 12px 14px; background: rgba(6, 12, 24, .72); border: 1px solid #1e3a5f; border-radius: 8px; backdrop-filter: blur(6px); }
      #hud .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
      #hud .row span { width: 52px; color: #7d9dc4; font-size: 11px; letter-spacing: .06em; }
      #hud .row b { min-width: 38px; text-align: right; font-weight: 600; }
      #hud .bar { flex: 1; height: 7px; background: #10203a; border-radius: 4px; overflow: hidden; }
      #hud .bar i { display: block; height: 100%; transition: width .12s linear; }
      #hud .obj { margin-top: 8px; padding-top: 8px; border-top: 1px solid #1e3a5f; color: #7dd3fc; font-size: 11px; }
      #hud .tgt { margin-top: 6px; font-size: 11px; color: #94a3b8; }
      #hud .tgt.ok { color: #4ade80; }
      #hud .end { margin-top: 10px; font-size: 18px; letter-spacing: .08em; color: #fbbf24; text-align: center; }

      #comms { position: fixed; bottom: 16px; left: 16px; width: 520px; max-height: 30vh; overflow: hidden; }
      #comms p { margin: 0 0 6px; padding: 6px 10px; background: rgba(6, 12, 24, .72); border-left: 2px solid #38bdf8; border-radius: 0 6px 6px 0; }
      #comms b { color: #38bdf8; margin-right: 6px; }

      #keys { position: fixed; bottom: 16px; right: 16px; text-align: right; color: #56708f; font-size: 11px; }
      #boot { position: fixed; inset: 0; display: grid; place-content: center; gap: 8px; text-align: center; background: #05070f; z-index: 10; }
      #boot h1 { margin: 0; font-size: 28px; letter-spacing: .3em; font-weight: 500; color: #7dd3fc; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="comms"></div>
    <div id="keys">
      W/S throttle · A/D steer · TAB target · SPACE beam · F torpedo · G dock · J warp
    </div>
    <div id="boot">
      <h1>PROXIMA</h1>
      <p>spinning up the sector…</p>
    </div>
    <script type="module" src="/src/host/main.ts"></script>
  </body>
</html>
